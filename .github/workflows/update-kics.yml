# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".

name: update-kics
on:
  workflow_dispatch: {}
  schedule:
    - cron: 0 9 * * THU
permissions:
  contents: read

jobs:
  update:
    runs-on: cx-public-ubuntu-x64
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.22.x
      - run: yarn install
      - run: go install github.com/goreleaser/goreleaser@latest
      - run: npx projen update-kics
      - uses: step-security/create-pull-request@50c103da2b9ca12cd5bc013fc6931051a5aa872b # v8.1.1
        with:
          token: ${{ secrets.PROJEN_GITHUB_TOKEN }}
          title: "feat: update kics version"
          commit-message: "feat: update kics version"
          branch: automation/update-kics
          committer: GitHub Automation <noreply@github.com>
          labels: auto-approve
      - if: steps.create-pr.outputs.pull-request-number != 0
        uses: peter-evans/enable-pull-request-automerge@684fed02ccc9b5eefcf7d40b65b3cd44255bd5bc # v2.5.0
        with:
          token: ${{ secrets.PROJEN_GITHUB_TOKEN }}
          pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
          merge-method: squash
